<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Смена пароля</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🤖 AI Shopping Bot</div>
            <div class="nav-links">
                <a href="login.html" class="nav-link">Вход</a>
                <a href="register.html" class="nav-link">Регистрация</a>
            </div>
        </div>
    </nav>
    <main class="auth-main">
        <div class="auth-container">
            <h2 class="auth-title">Забыли пароль?</h2>
            <p>Введите ваш email, и мы отправим ссылку для смены пароля</p>

            <form id="changePasswordForm" class="auth-form">
              <div class="form-group">
                <label for="email">Email:</label>
                <input 
                  type="email" 
                  id="email" 
                  class="form-input"
                  required
                  placeholder="example@mail.com"
                >
              </div>

              <button type="submit" class="submit-btn">Отправить ссылку</button>

              <div id="error" class="error-message"></div>
              <div id="success" class="success-message"></div>
            </form>
            <div class="form-footer">
                <a href="login.html" class="link">Вернуться к входу</a>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
