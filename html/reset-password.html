<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Установка нового пароля</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">🤖 AI Shopping Bot</a>
            </div>
            <div class="nav-links">
                <a href="login.html" class="nav-link">Вход</a>
                <a href="register.html" class="nav-link">Регистрация</a>
            </div>
        </div>
    </nav>
    <main class="auth-main">
        <div class="auth-container">
            <h2 class="auth-title">Установите новый пароль</h2>
            <div class="form-group">
                <label for="loginEmail">Email или логин</label>
                <input 
                    type="text" 
                    id="loginEmail" 
                    class="form-input" 
                    placeholder="your@email.com"
                    required
                >
            </div>
            <form class="loginForm" id="resetPasswordForm">
                
                <div class="form-group">
                    <label for="newPassword">Пароль</label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Подтвердите пароль:</label>
                    <input 
                      type="password" 
                      id="confirmPassword"
                      class="form-input" 
                      required
                      placeholder="Повторите пароль"
                    >
                </div>

                

                <div id="error" class="error-message"></div>
                <div id="success" class="success-message"></div>

                <button type="submit" class="submit-btn">Изменить пароль</button>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
